[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fiqh-search"
version = "0.1.0"
description = "Full-text search over classical Shafi'i fiqh books from Shamela"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "truststore>=0.9",
]

[project.scripts]
fiqh = "fiqh_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fiqh_search = [
    "web/templates/*.html",
    "static_site/templates/*.html",
    "static_site/assets/*",
]
