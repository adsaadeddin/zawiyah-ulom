[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zawiyah-ulom"
version = "0.1.0"
description = "زاوية العلوم: a personal library and search engine for the Islamic sciences (books from Shamela and ketabonline)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "truststore>=0.9",
]

[project.scripts]
zawiyah = "zawiyah_ulom.cli:main"
zawiyah-ulom = "zawiyah_ulom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zawiyah_ulom = [
    "web/templates/*.html",
    "static_site/templates/*.html",
    "static_site/assets/*",
]
