<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}زاوية العلوم{% endblock %}</title>
  <meta name="description" content="زاوية العلوم: مكتبة وبحث في كتب العلوم الشرعية، مع قراءة مقارنة للمتون وشروحها وتراجم العلماء">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ root }}assets/style.css">
  <script src="{{ root }}assets/science.js"></script>
</head>
<body>
  <header><div class="wrap">
    <a class="brand" href="{{ root }}index.html">زاوية العلوم</a>
    <span class="muted">نسخة تجريبية</span>
    <nav>
      <a href="{{ root }}study/index.html">قراءة مقارنة</a>
      <a href="{{ root }}tarajem/index.html">التراجم</a>
    </nav>
  </div>
  {% if sciences %}
  <nav class="science-tabs" aria-label="العلوم"><div class="wrap">
    {% for sc in sciences %}
      <a href="{{ '' if filters else root ~ 'index.html' }}?sci={{ sc.slug }}" data-tab="{{ sc.slug }}" data-name="{{ sc.name }}">{{ sc.name }} <span class="count">{{ sc.books }}</span></a>
    {% endfor %}
    <a href="{{ '' if filters else root ~ 'index.html' }}?sci=all" data-tab="all" class="all">الكل</a>
  </div></nav>
  {% endif %}
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer class="wrap muted">
    النصوص منقولة من <a href="https://shamela.ws" target="_blank" rel="noopener">المكتبة الشاملة</a> و<a href="https://ketabonline.com" target="_blank" rel="noopener">جامع الكتب الإسلامية</a>، وحقوق الطبعات لناشريها.
    · <a href="https://github.com/adsaadeddin/zawiyah-ulom" target="_blank" rel="noopener">الشيفرة المصدرية</a>
  </footer>
</body>
</html>
