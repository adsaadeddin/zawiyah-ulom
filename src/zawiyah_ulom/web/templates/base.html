<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}زاوية العلوم{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f3; --surface: #ffffff; --text: #1f1d1a; --muted: #6b665d;
      --border: #e4dfd3; --accent: #1f6f5c; --accent-soft: #e3f0ec; --mark: #fbe7a1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161513; --surface: #201f1c; --text: #ece8df; --muted: #a39d91;
        --border: #36332d; --accent: #6cc2a8; --accent-soft: #1d3530; --mark: #6b5414;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Noto Kufi Arabic", "Segoe UI", Tahoma, sans-serif; font-size: 15px; line-height: 1.7;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { border-bottom: 1px solid var(--border); background: var(--surface); }
    header .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; }
    header .brand { font-weight: 600; font-size: 17px; color: var(--text); }
    .wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; }
    main { padding-block: 24px 64px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 17px; margin: 32px 0 12px; }
    .muted { color: var(--muted); font-size: 13px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
    .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .tag { display: inline-block; font-size: 12px; padding: 1px 10px; border-radius: 999px;
           background: var(--accent-soft); color: var(--accent); margin: 2px 0 2px 4px; }
    .tag.active { background: var(--accent); color: var(--surface); }
    form.search { display: flex; gap: 8px; flex-wrap: wrap; }
    form.search input, form.search select, form.search button {
      font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text);
    }
    form.search input { flex: 1 1 260px; }
    form.search button { background: var(--accent); color: var(--surface); border-color: var(--accent); cursor: pointer; }
    .snippet { font-family: Amiri, serif; font-size: 18px; line-height: 1.9; margin-top: 6px; }
    mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
    .reading p { font-family: Amiri, serif; font-size: 21px; line-height: 2.1; margin: 0 0 14px; text-align: justify; }
    .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px;
             border-top: 1px solid var(--border); padding-top: 16px; font-size: 14px; }
    ol.toc { padding-inline-start: 20px; }
    ol.toc ol { margin: 4px 0 12px; }
    details summary { cursor: pointer; font-weight: 600; }
    header nav { margin-inline-start: auto; font-size: 14px; }
    .note { border-inline-start: 4px solid var(--accent); }
    .note h2 { margin-top: 0; }
    .note-body { white-space: pre-wrap; font-family: Amiri, serif; font-size: 19px; line-height: 1.9; margin: 6px 0; }
    .note-body.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .note textarea {
      width: 100%; margin-top: 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-family: Amiri, serif; font-size: 19px; line-height: 1.8; resize: vertical;
    }
    .note-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .note-actions button { font: inherit; padding: 8px 20px; border-radius: 8px; border: 0; background: var(--accent); color: var(--surface); cursor: pointer; }
    .saved { color: var(--accent); font-weight: 600; margin: 0 0 6px; }
    .note-mark { font-size: 13px; margin-inline-start: 6px; }
    header nav { display: flex; gap: 18px; }
    header nav a.active { font-weight: 600; text-decoration: underline; text-underline-offset: 6px; }
    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .button { display: inline-block; padding: 7px 16px; border-radius: 8px; background: var(--accent); color: var(--surface); font-size: 14px; }
    .button:hover { text-decoration: none; opacity: .9; }
    .error { color: #b3261e; background: color-mix(in srgb, #b3261e 10%, transparent); border-radius: 8px; padding: 8px 12px; }
    .error ul { margin: 4px 0 0; }
    .scholar-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .badges { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 8px 0 16px; }
    dl.facts dt { color: var(--muted); font-size: 13px; }
    dl.facts dd { margin: 0; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 640px) { .two-col { grid-template-columns: 1fr; } }
    .two-col h2, section.card h2 { margin-top: 0; }
    .tarjama-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .tarjama-form .wide { grid-column: 1 / -1; }
    @media (max-width: 640px) { .tarjama-form { grid-template-columns: 1fr; } }
    .tarjama-form label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
    .tarjama-form input, .tarjama-form textarea, .tarjama-form select {
      font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    }
    .tarjama-form textarea[name="bio"] { font-family: Amiri, serif; font-size: 19px; line-height: 1.8; }
    .tarjama-form .invalid input, .tarjama-form .invalid textarea { border-color: #b3261e; }
    .tarjama-form .note-actions button { font: inherit; padding: 8px 24px; border-radius: 8px; border: 0; background: var(--accent); color: var(--surface); cursor: pointer; }
    .danger-zone { margin-top: 32px; }
    /* Highlighted notes: one colour per kind (فائدة، سؤال، إشكال، للتدريس). */
    :root { --k-faida: #f2c94c; --k-question: #56a3e8; --k-ishkal: #e5604d; --k-teaching: #3fb27f; }
    mark.ann { background: color-mix(in srgb, var(--k) 30%, transparent); border-bottom: 2px solid var(--k);
               border-radius: 2px; padding: 0 1px; cursor: pointer; color: inherit; }
    mark.ann.multi { border-bottom-style: double; border-bottom-width: 4px; }
    mark.ann:focus { outline: 2px solid var(--k); }
    .kind-faida { --k: var(--k-faida); } .kind-question { --k: var(--k-question); }
    .kind-ishkal { --k: var(--k-ishkal); } .kind-teaching { --k: var(--k-teaching); }
    .ann-card { background: var(--surface); border: 1px solid var(--border); border-inline-start: 4px solid var(--k, var(--accent));
                border-radius: 10px; padding: 10px 14px; margin: -6px 0 14px; font-size: 15px; }
    .ann-head { display: flex; align-items: center; gap: 10px; }
    .ann-head .ann-close { margin-inline-start: auto; font-size: 20px; line-height: 1; }
    .kind-badge { font-size: 12px; padding: 1px 10px; border-radius: 999px; background: color-mix(in srgb, var(--k) 25%, transparent); }
    .ann-quote { margin: 8px 0; padding: 4px 12px; border-inline-start: 3px solid var(--k, var(--border));
                 font-family: Amiri, serif; font-size: 17px; color: var(--muted); }
    .ann-form textarea { width: 100%; margin-top: 8px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
                         background: var(--bg); color: var(--text); font-family: Amiri, serif; font-size: 18px; line-height: 1.8; }
    .ann-form .note-actions button[type=submit] { font: inherit; padding: 6px 18px; border-radius: 8px; border: 0;
                                                   background: var(--accent); color: var(--surface); cursor: pointer; }
    .kind-picker { display: flex; gap: 6px; flex-wrap: wrap; }
    .kind-picker label { font-size: 13px; padding: 2px 10px 2px 8px; border-radius: 999px; cursor: pointer;
                         border: 1px solid var(--k); background: color-mix(in srgb, var(--k) 12%, transparent); }
    .kind-picker label:has(input:checked) { background: color-mix(in srgb, var(--k) 40%, transparent); font-weight: 600; }
    .ann-add { position: absolute; z-index: 10; width: 90px; padding: 6px 10px; border-radius: 8px; border: 0; font: inherit;
               font-size: 14px; background: var(--accent); color: var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,.25); cursor: pointer; }
    .ann-add[disabled] { width: auto; background: var(--muted); cursor: default; }
    button.link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
    .hint { font-size: 12px; }
    .kind-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 12px; }
    .kind-chips a { font-size: 13px; padding: 2px 12px; border-radius: 999px; border: 1px solid var(--k, var(--border)); color: var(--text);
                    background: color-mix(in srgb, var(--k, var(--border)) 12%, transparent); }
    .kind-chips a.active { background: color-mix(in srgb, var(--k, var(--accent)) 45%, transparent); font-weight: 600; }
    /* قراءة مقارنة */
    .study-controls { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin: 8px 0; font-size: 14px; }
    .study-controls select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    .study-books { display: flex; gap: 14px; flex-wrap: wrap; }
    .study-row { margin: 22px 0 30px; }
    .matn-box { display: flex; gap: 10px; align-items: baseline; background: var(--accent-soft); border-radius: 10px; padding: 10px 14px;
                font-family: Amiri, serif; font-size: 21px; line-height: 2; font-weight: 700; }
    .matn-box .num { font-family: "Noto Kufi Arabic", sans-serif; font-size: 12px; font-weight: 400; color: var(--muted); min-width: 1.6em; }
    .matn-box .matn-text { flex: 1; }
    .matn-box .open-link { font-size: 14px; font-weight: 400; }
    .shuruh { display: grid; gap: 12px; margin-top: 10px; }
    .shuruh.cols-2 { grid-template-columns: 1fr 1fr; }
    .shuruh.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
    @media (max-width: 760px) { .shuruh.cols-2, .shuruh.cols-3 { grid-template-columns: 1fr; } }
    .sharh { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; min-width: 0; }
    .sharh-head { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 6px; }
    .sharh-section { font-size: 12px; margin: 6px 0 2px; }
    .sharh-text { font-family: Amiri, serif; font-size: 18px; line-height: 1.95; max-height: 22em; overflow: hidden;
                  -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent); mask-image: linear-gradient(to bottom, #000 80%, transparent); }
    .sharh-text.open { max-height: none; -webkit-mask-image: none; mask-image: none; }
    .sharh-text p { margin: 0 0 8px; text-align: justify; }
    /* Study view: my notes column (narrow) */
    .shuruh.with-notes.cols-1 { grid-template-columns: 1fr minmax(170px, .5fr); }
    .shuruh.with-notes.cols-2 { grid-template-columns: 1fr 1fr minmax(170px, .55fr); }
    .shuruh.with-notes.cols-3 { grid-template-columns: 1fr 1fr 1fr minmax(170px, .55fr); }
    @media (max-width: 760px) { .shuruh.with-notes { grid-template-columns: 1fr !important; } }
    .notes-col { background: color-mix(in srgb, var(--accent-soft) 60%, var(--surface)); border: 1px dashed var(--border);
                 border-radius: 10px; padding: 10px 12px; font-size: 14px; min-width: 0; }
    .note-compact { border-inline-start: 3px solid var(--k); padding: 2px 8px; margin: 6px 0; }
    .note-compact .note-body { font-size: 16px; line-height: 1.7; margin: 2px 0; }
    .passage-notes { list-style: none; padding: 0; margin: 6px 0; }
    .passage-notes li { margin: 4px 0; }
    .passage-notes a { display: block; color: var(--text); padding: 3px 6px; border-radius: 6px; }
    .passage-notes a:hover { background: var(--surface); text-decoration: none; }
    .passage-notes .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--k); margin-inline-end: 4px; }
    .passage-notes .q { color: var(--muted); font-size: 12px; }
    .passage-notes .b { display: block; font-size: 13px; }
    .add-para-note summary { font-size: 13px; color: var(--accent); cursor: pointer; margin-top: 6px; }
    .matn-text p { margin: 0; }
    .matn-text .ann-card { font-weight: 400; font-size: 15px; font-family: "Noto Kufi Arabic", sans-serif; }
    /* Science tabs (workspaces) */
    .science-tabs { border-top: 1px solid var(--border); background: var(--bg); }
    .science-tabs .wrap { display: flex; gap: 4px; overflow-x: auto; padding-block: 0; scrollbar-width: thin; }
    .science-tabs a { padding: 8px 14px 7px; font-size: 14px; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
    .science-tabs a:hover { color: var(--text); text-decoration: none; }
    .science-tabs a.active { color: var(--accent); font-weight: 600; border-bottom-color: var(--accent); }
    .science-tabs .count { font-size: 11px; background: var(--border); color: var(--muted); border-radius: 999px; padding: 0 7px; margin-inline-start: 2px; }
    .science-tabs a.active .count { background: var(--accent-soft); color: var(--accent); }
    .science-tabs a.all { margin-inline-start: auto; }
    .empty-science { text-align: center; padding: 32px 16px; }
    .science-picker { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px 10px; margin: 10px 0;
                      display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; }
    .science-picker legend { font-size: 13px; font-weight: 600; padding: 0 6px; color: var(--accent); }
    .science-picker label { font-size: 14px; cursor: pointer; }
    .science-picker .muted { font-size: 12px; }
    .accept-form { flex: 1 1 100%; }
    .book-sciences summary { font-size: 13px; color: var(--muted); cursor: pointer; margin-top: 4px; }
    /* Footnotes (Shamela «حاشية», marked ⸙ by the scraper): smaller and set apart, like the print. */
    p.footnote { font-size: 0.78em !important; line-height: 1.75 !important; color: var(--muted, #555);
                 border-top: 1px solid var(--border, #ccc); padding-top: 4px; margin-top: 6px; text-align: right; }
    progress { width: 100%; height: 14px; accent-color: var(--accent); }
    .sample { margin: 8px 0 12px; }
    dd.ok { color: var(--accent); }
    button.button { border: 0; cursor: pointer; font: inherit; }
    button[disabled] { opacity: .5; cursor: not-allowed; }
    .danger { font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 8px; border: 1px solid #b3261e; background: transparent; color: #b3261e; cursor: pointer; }
  </style>
</head>
<body>
  <header><div class="wrap">
    <a class="brand" href="{{ url_for('ui_home') }}">زاوية العلوم</a>
    <nav>
      <a href="{{ url_for('ui_study_index') }}" {% if request.path.startswith('/study') %}class="active"{% endif %}>قراءة مقارنة</a>
      <a href="{{ url_for('ui_library') }}" {% if request.path.startswith('/library') %}class="active"{% endif %}>المكتبة</a>
      <a href="{{ url_for('ui_tarajem') }}" {% if request.path.startswith('/tarajem') %}class="active"{% endif %}>التراجم</a>
      <a href="{{ url_for('ui_notes') }}" {% if request.path.startswith('/notes') %}class="active"{% endif %}>✎ ملاحظاتي</a>
    </nav>
  </div>
  {% if sciences %}
  <nav class="science-tabs" aria-label="العلوم"><div class="wrap">
    {% set back = request.full_path.rstrip('?') %}
    {% for sc in sciences %}
      <a href="{{ url_for('ui_switch_science', slug=sc.slug, next=back) }}" class="{{ 'active' if sc.slug == current_science else '' }}">
        {{ sc.name }} <span class="count">{{ sc.books }}</span></a>
    {% endfor %}
    <a href="{{ url_for('ui_switch_science', slug='all', next=back) }}" class="all {{ 'active' if current_science == 'all' else '' }}">الكل</a>
  </div></nav>
  {% endif %}
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
</body>
</html>
